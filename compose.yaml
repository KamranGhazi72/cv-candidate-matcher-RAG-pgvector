version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cv_matcher_postgres
    environment:
      POSTGRES_DB: cv_matcher_db
      POSTGRES_USER: matcher_user
      POSTGRES_PASSWORD: matcher_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matcher_user -d cv_matcher_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: cv_matcher_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pgdata:
  ollama_data: